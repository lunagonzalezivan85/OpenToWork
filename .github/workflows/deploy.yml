# Despliegue a produccion (IIS en el servidor de TratoDirecto).
# Se ejecuta en un runner self-hosted instalado en el propio servidor.
# - Compila la solucion; si algo falla, no se toca el servidor.
# - Comprueba que IIS tiene lo que necesitan los web.config (URL Rewrite, ARR); si no, no se toca el servidor.
# - Guarda una copia de cada sitio antes de sustituirlo y la restaura si la comprobacion final falla.
# - Nunca sobrescribe appsettings.Production.json ni logs/ del servidor.
# - Los archivos de usuarios viven en C:\inetpub\TratoDirecto\storage (fuera de los sitios).
# - Migraciones de EF Core: si hay pendientes, se hace un mysqldump completo y se aplican
#   ANTES de tocar los sitios. Si fallan, no se despliega nada. La BD no se revierte sola:
#   el dump queda en deploy-backup\db para restaurarlo a mano si hiciera falta.
#
# WEB (portal del candidato) es Blazor WebAssembly: IIS sirve archivos estaticos y
# hace de proxy inverso de /api/* hacia TD-API (ver src/OpenToWork.WEB/web.config).

name: Deploy produccion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, tratodirecto]
    env:
      SITES_ROOT: C:\inetpub\TratoDirecto\sites
      PUBLIC_URL: https://tratodirecto.es
      MYSQL_BIN: C:\Program Files\MySQL\MySQL Server 8.4\bin
      DB_BACKUPS_TO_KEEP: '15'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Restaurar
        run: dotnet restore OpenToWork.slnx

      # OpenToWork.Tests son tests de integracion contra una API de desarrollo
      # (localhost:5100 con datos de prueba), no se pueden ejecutar aqui.
      # Compilar toda la solucion detiene el despliegue si algo no compila.
      - name: Compilar
        run: dotnet build OpenToWork.slnx -c Release --no-restore

      - name: Publicar
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = 'API','AdminAPI','WEB','AdminWEB'
          foreach ($a in $apps) {
            dotnet publish "src/OpenToWork.$a/OpenToWork.$a.csproj" -c Release --no-restore -o "publish/$a"
            if ($LASTEXITCODE -ne 0) { throw "Fallo al publicar $a" }
          }
          # Ejecutable autonomo con todas las migraciones (usa AppDbContextDesignTimeFactory)
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Fallo dotnet tool restore' }
          dotnet tool run dotnet-ef migrations bundle --project src/OpenToWork.Models --startup-project src/OpenToWork.Models --configuration Release --output publish/efbundle/migrate.exe --force
          if ($LASTEXITCODE -ne 0) { throw 'Fallo al generar el bundle de migraciones' }

      - name: Comprobar requisitos de IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # La cuenta del runner no puede leer applicationHost.config: se comprueban las DLL de los modulos.
          # Que el proxy de ARR este activado lo verifica la comprobacion final de /api (con vuelta atras).
          $faltan = @()
          $usaRewrite = Select-String -Path publish\*\web.config -Pattern '<rewrite>' -Quiet
          $usaProxy = Select-String -Path publish\*\web.config -Pattern 'url="http://127\.0\.0\.1:\d+/' -Quiet
          if ($usaRewrite -and -not (Test-Path "$env:windir\System32\inetsrv\rewrite.dll")) { $faltan += 'URL Rewrite' }
          if ($usaProxy -and -not (Test-Path "$env:ProgramFiles\IIS\Application Request Routing\requestRouter.dll")) { $faltan += 'Application Request Routing (ARR)' }
          if ($faltan.Count) { throw "Falta en IIS: $($faltan -join ', '). No se ha tocado el servidor." }
          Write-Host 'IIS tiene todo lo necesario.'

      - name: Migrar base de datos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Misma cadena de conexion que usa la API en produccion (nunca se imprime)
          $settings = Join-Path $env:SITES_ROOT 'API\appsettings.Production.json'
          $cs = (Get-Content $settings -Raw | ConvertFrom-Json).ConnectionStrings.DefaultConnection
          if (-not $cs) { throw "No hay ConnectionStrings:DefaultConnection en $settings. No se ha tocado nada." }
          $b = New-Object System.Data.Common.DbConnectionStringBuilder
          $b.set_ConnectionString($cs)  # con "$b.ConnectionString =" PowerShell crea una clave en vez de parsear
          function Valor([string[]]$claves, $defecto) {
            foreach ($k in $claves) { if ($b.ContainsKey($k) -and "$($b[$k])") { return "$($b[$k])" } }
            return $defecto
          }
          $db = Valor 'Database','Initial Catalog' $null
          if (-not $db) { throw 'La cadena de conexion no indica la base de datos.' }
          $clave = Valor 'Password','Pwd' ''
          if ($clave) { Write-Host "::add-mask::$clave" }
          $cnf = Join-Path $env:RUNNER_TEMP 'td-mysql.cnf'
          @(
            '[client]'
            "host=$(Valor 'Server','Host','Data Source','Address' 'localhost')"
            "port=$(Valor 'Port' '3306')"
            "user=$(Valor 'User','User Id','Uid','Username' 'root')"
            "password=`"$($clave.Replace('\', '\\').Replace('"', '\"'))`""
          ) | Set-Content $cnf -Encoding ASCII
          try {
            $mysql = Join-Path $env:MYSQL_BIN 'mysql.exe'
            $aplicadas = @(& $mysql "--defaults-extra-file=$cnf" -N -B -e "SELECT MigrationId FROM ``$db``.__EFMigrationsHistory ORDER BY MigrationId")
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo leer __EFMigrationsHistory.' }
            $enRepo = @(Get-ChildItem src\OpenToWork.Models\Migrations -Filter *.cs |
              Where-Object { $_.Name -match '^\d{14}_' -and $_.Name -notlike '*.Designer.cs' } |
              ForEach-Object { $_.BaseName } | Sort-Object)
            $desconocidas = @($aplicadas | Where-Object { $_ -notin $enRepo })
            if ($desconocidas.Count) { throw "La BD tiene migraciones que no estan en main: $($desconocidas -join ', '). No se ha tocado nada." }
            $pendientes = @($enRepo | Where-Object { $_ -notin $aplicadas })
            Write-Host "Aplicadas: $($aplicadas.Count). En el repo: $($enRepo.Count). Pendientes: $($pendientes.Count)."
            if (-not $pendientes.Count) { Write-Host 'Base de datos al dia.'; return }
            $pendientes | ForEach-Object { Write-Host "  - $_" }

            # Copia completa antes de migrar
            $dumpDir = Join-Path $env:RUNNER_WORKSPACE 'deploy-backup\db'
            New-Item -ItemType Directory -Force $dumpDir | Out-Null
            $dump = Join-Path $dumpDir ("{0}-{1}-antes-de-{2}.sql" -f $db, (Get-Date -Format 'yyyyMMdd-HHmmss'), $pendientes[0])
            & (Join-Path $env:MYSQL_BIN 'mysqldump.exe') "--defaults-extra-file=$cnf" --single-transaction --routines --triggers --events --default-character-set=utf8mb4 "--result-file=$dump" --databases $db
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dump) -or (Get-Item $dump).Length -lt 1024) { throw 'Fallo el mysqldump. No se ha migrado ni desplegado nada.' }
            Write-Host "Copia de la BD: $dump ($([math]::Round((Get-Item $dump).Length / 1MB, 1)) MB)"
            Get-ChildItem $dumpDir -Filter *.sql | Sort-Object LastWriteTime -Descending |
              Select-Object -Skip ([int]$env:DB_BACKUPS_TO_KEEP) | Remove-Item -Force

            $env:ConnectionStrings__DefaultConnection = $cs
            & publish\efbundle\migrate.exe
            if ($LASTEXITCODE -ne 0) { throw "Fallo al aplicar migraciones. No se ha desplegado nada. Copia previa: $dump" }
            Write-Host "::notice::Migraciones aplicadas: $($pendientes -join ', '). Copia previa: $dump"
          }
          finally {
            Remove-Item $cnf -Force -ErrorAction SilentlyContinue
            Remove-Item Env:ConnectionStrings__DefaultConnection -ErrorAction SilentlyContinue
          }

      - name: Desplegar en IIS
        id: desplegar
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backupRoot = Join-Path $env:RUNNER_WORKSPACE 'deploy-backup'
          $marker = Join-Path $backupRoot 'desplegados.txt'
          New-Item -ItemType Directory -Force $backupRoot | Out-Null
          Set-Content $marker '' -Encoding UTF8
          # APIs primero, luego las webs que las consumen
          $apps = 'API','AdminAPI','WEB','AdminWEB'
          foreach ($a in $apps) {
            $dest = Join-Path $env:SITES_ROOT $a
            $offline = Join-Path $dest 'app_offline.htm'
            Write-Host "==> $a -> $dest"
            robocopy $dest (Join-Path $backupRoot $a) /MIR /R:2 /W:2 /XF app_offline.htm appsettings.Production.json /XD logs /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) { throw "No se pudo hacer copia de seguridad de $a (codigo $LASTEXITCODE)" }
            Add-Content $marker $a
            Set-Content -Path $offline -Value '<html><body><h2>Actualizando, vuelve en unos segundos...</h2></body></html>' -Encoding UTF8
            Start-Sleep -Seconds 5
            try {
              robocopy "publish\$a" $dest /MIR /R:5 /W:3 /XF app_offline.htm appsettings.Production.json /XD logs /NFL /NDL /NJH /NP
              if ($LASTEXITCODE -ge 8) { throw "robocopy fallo en $a (codigo $LASTEXITCODE)" }
            }
            finally {
              Remove-Item $offline -Force -ErrorAction SilentlyContinue
            }
          }
          exit 0

      - name: Comprobar que las apps funcionan
        shell: powershell
        run: |
          function Probar($url, [int[]]$esperado, $contentType) {
            $status = 0; $tipo = ''
            for ($i = 0; $i -lt 6; $i++) {
              try {
                $r = Invoke-WebRequest $url -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
                $status = [int]$r.StatusCode; $tipo = "$($r.Headers['Content-Type'])"
              } catch {
                if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode; $tipo = "$($_.Exception.Response.ContentType)" } else { $status = 0 }
              }
              $ok = ($status -in $esperado) -and (-not $contentType -or $tipo -like "*$contentType*")
              if ($ok) { break }
              Start-Sleep -Seconds 5
            }
            Write-Host "$url -> HTTP $status $tipo"
            return $ok
          }
          # APIs y AdminWEB: basta con que respondan sin error 5xx
          $internos = 400..499 + 200..399
          $checks = @(
            @{ Url = 'http://127.0.0.1:5000/'; Ok = $internos },
            @{ Url = 'http://127.0.0.1:5001/'; Ok = $internos },
            @{ Url = 'http://127.0.0.1:5002/'; Ok = $internos },
            # Portal WASM: pagina, runtime de Blazor y proxy /api -> TD-API (tiene que devolver JSON de la API)
            @{ Url = "$env:PUBLIC_URL/"; Ok = @(200) },
            @{ Url = "$env:PUBLIC_URL/_framework/blazor.webassembly.js"; Ok = @(200) },
            @{ Url = "$env:PUBLIC_URL/api/vacancies/search"; Ok = @(200); Tipo = 'application/json' }
          )
          $fallos = @()
          foreach ($c in $checks) { if (-not (Probar $c.Url $c.Ok $c.Tipo)) { $fallos += $c.Url } }
          if ($fallos.Count) { throw "Fallaron: $($fallos -join ', ')" }

      - name: Restaurar version anterior si algo fallo
        if: failure() && steps.desplegar.outcome != 'skipped'
        shell: powershell
        run: |
          $backupRoot = Join-Path $env:RUNNER_WORKSPACE 'deploy-backup'
          $marker = Join-Path $backupRoot 'desplegados.txt'
          if (-not (Test-Path $marker)) { Write-Host 'No hay nada que restaurar.'; exit 0 }
          foreach ($a in (Get-Content $marker | Where-Object { $_ })) {
            $dest = Join-Path $env:SITES_ROOT $a
            Write-Host "<== Restaurando $a"
            robocopy (Join-Path $backupRoot $a) $dest /MIR /R:5 /W:3 /XF app_offline.htm appsettings.Production.json /XD logs /NFL /NDL /NJH /NP
            Remove-Item (Join-Path $dest 'app_offline.htm') -Force -ErrorAction SilentlyContinue
          }
          Write-Host '::error::El despliegue fallo y se restauro la version anterior de los sitios. Revisa el log de los pasos anteriores.'
          Write-Host '::warning::Si el paso "Migrar base de datos" aplico migraciones, la BD NO se ha revertido (el dump previo esta en deploy-backup\db).'
          exit 0
